<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>{{title}}</title>
<script>
  // 嵌进别的网页时（地址带 ?embed）：只要画面，铺满。
  if (/[?&#]embed\b/.test(location.search + location.hash)) document.documentElement.classList.add("embed");
</script>
<style>
  :root { --bg: #14121f; --panel: #221f33; --ink: #f2efe6; --ink2: #9d97b3; --accent: #ffd23f; --btn: #3a3554; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; touch-action: none; -webkit-user-select: none; user-select: none; }
  h1 { margin: 0; font-size: 18px; letter-spacing: 2px; }
  .shell { background: var(--panel); padding: 12px; border-radius: 6px; box-shadow: 0 0 0 2px #000, 0 8px 0 #0006; max-width: 100%; }
  canvas { display: block; width: min(720px, calc(100vw - 56px)); aspect-ratio: 3 / 2; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  #status { color: var(--accent); min-height: 1.5em; text-align: center; }
  .keys { color: var(--ink2); font-size: 12px; text-align: center; }
  .pad { display: none; width: min(720px, 100%); justify-content: space-between; align-items: center; }
  .dpad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); }
  .ab { display: flex; gap: 14px; }
  .mid { display: flex; gap: 10px; }
  button { background: var(--btn); color: var(--ink); border: 0; border-radius: 6px; font: inherit; font-weight: bold; }
  .dpad button { border-radius: 4px; }
  .ab button { width: 60px; height: 60px; border-radius: 50%; }
  .mid button { padding: 6px 10px; font-size: 11px; }
  button:active { background: var(--accent); color: #000; }
  .made { color: var(--ink2); font-size: 11px; }
  .made a, .made button { color: var(--ink2); }
  .made button { background: none; padding: 0; font: inherit; font-weight: normal; text-decoration: underline; cursor: pointer; }
  @media (pointer: coarse) { .pad { display: flex; } .keys { display: none; } }
  .embed body { padding: 0; gap: 0; background: #000; }
  .embed h1, .embed #status, .embed .keys, .embed .made, .embed .pad { display: none; }
  .embed .shell { padding: 0; border-radius: 0; box-shadow: none; background: #000; }
  .embed canvas { width: 100vw; height: 100vh; aspect-ratio: auto; object-fit: contain; }
</style>
</head>
<body>
<h1>{{title}}</h1>
<div class="shell"><canvas id="screen" width="240" height="160"></canvas></div>
<div id="status" data-t="sound"></div>
<div class="pad">
  <div class="dpad">
    <span></span><button data-key="up" aria-label="Up">▲</button><span></span>
    <button data-key="left" aria-label="Left">◀</button><span></span><button data-key="right" aria-label="Right">▶</button>
    <span></span><button data-key="down" aria-label="Down">▼</button><span></span>
  </div>
  <div class="mid"><button data-key="select">SELECT</button><button data-key="start">START</button></div>
  <div class="ab"><button data-key="b">B</button><button data-key="a">A</button></div>
</div>
<div class="keys" data-t="keys"></div>
<div class="made"><span data-t="made"></span> · <button id="lang" type="button"></button></div>
<script>window.VP = {{data}};</script>
<script>{{player}}</script>
</body>
</html>
