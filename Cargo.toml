# VibePlay SDK：命令行、库、样板游戏。建在公开的 qingos-sdk 上。
[workspace]
resolver = "2"
members = ["vibeplay", "cli", "examples/*", "templates/blank"]

[workspace.package]
version = "0.4.0"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/second-state/vibeplay-sdk"

[workspace.dependencies]
anyhow = "1"
serde_json = "1"
qapp = { git = "https://github.com/second-state/qingos-sdk" }
qfull = { git = "https://github.com/second-state/qingos-sdk" }

# 开发机上直接编 .wasm：编译器不优化时编一个小游戏要两秒多。
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

# 游戏编成 wasm 用 release：小、快。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
