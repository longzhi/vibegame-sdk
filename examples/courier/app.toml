# 游戏《疾风邮差》：横版跳跃。
[app]
name        = "courier"
title       = "Gale Courier"
title_zh    = "疾风邮差"
description    = "Side-scrolling platformer. Run, jump and bump boxes to deliver six urgent letters, then stop the mail thief."
description_zh = "横版跳跃：小邮差送急件，跑、跳、顶箱子、踩发条兵，六关，最后打邮件大盗"   # 集市上的介绍
langs          = ["en", "zh"]
version     = "0.2.1"
command     = "bin/courier.cwasm"
screen      = "full"
cover       = "assets/cover.png"   # 家上的封面：tools/game-covers.py 画的，96×80
rate_hz     = 60
memory_mb   = 16
