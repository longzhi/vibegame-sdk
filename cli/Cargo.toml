[package]
name = "vibeplay-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "VibePlay 的命令行：起一个游戏、开窗口玩、按脚本跑、截图、出网页版、打包、推到掌机"

[[bin]]
name = "vibeplay"
path = "src/main.rs"

[dependencies]
# 画面、按键、合成器和掌机用同一份代码。compile：直接跑 cargo 编出来的 .wasm、给掌机编 .cwasm。
qfull = { workspace = true, features = ["compile"] }
anyhow.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "0.8"
png = "0.18"
# 窗口：一个库管窗口、键盘、交一块 0RGB 的像素，不用 GPU。Linux 上只开 x11：运行时 dlopen libX11。
minifb = { version = "0.29", default-features = false, features = ["x11"] }
# 声音：一条输出流，cpal 直接调 CoreAudio / ALSA。
cpal = "0.16"
# 打 .vp 包（tar.gz）。
tar = "0.4"
flate2 = "1"
# 改一改：下载的源码对一遍列表里的 sha256。
sha2 = "0.10"
# 推到掌机、发到集市：一个阻塞的 HTTP 客户端。掌机只在局域网里走 http；集市走 https（rustls）。
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
